<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Arc, the Xenon Discord bot. A flat mark: the two chevrons of the Xenon logo (the electrodes) with the arc struck
       between them as a bold lightning bolt. Solid colours and clean edges, made to crop to a circle (Discord shows
       avatars round): everything sits well inside the middle. -->
  <rect width="1024" height="1024" fill="#1e3fae"/>
  <circle cx="512" cy="512" r="430" fill="#2654d1"/>
  <!-- The electrodes: the Xenon chevrons, in white (drawn from the 24-unit mark, at 26x, centred). -->
  <g transform="translate(200 200) scale(26)" fill="#ffffff">
    <path d="M2.9 3.75h3.38l4.5 8.25-4.5 8.25H2.9L7.4 12z"/>
    <path d="M21.1 3.75h-3.38L13.22 12l4.5 8.25h3.38L16.6 12z"/>
  </g>
  <!-- The arc: a bold lightning bolt between them, outlined in the dark blue so it stands clear of the white. -->
  <path d="M600 196 L404 552 L506 552 L448 828 L640 452 L534 452 Z"
        fill="#ffd23f" stroke="#15308a" stroke-width="16" stroke-linejoin="round"/>
</svg>

