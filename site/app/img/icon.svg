<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- The Xenon mark: an X made of two code chevrons facing each other, like the electrodes of a xenon lamp,
       with the arc struck in the gap between them. tools/make-icons.js draws every other icon from this file.
       Since 2026-11-25: a near-black tile, chevrons from white to grey, and the spark in the accent blue. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17171a"/><stop offset="1" stop-color="#060607"/></linearGradient>
    <linearGradient id="jaw" x1="0" y1="0" x2="0" y2="1"><stop offset=".25" stop-color="#ffffff"/><stop offset="1" stop-color="#a1a1aa"/></linearGradient>
    <radialGradient id="arc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#6b9ef7" stop-opacity=".5"/><stop offset=".55" stop-color="#6b9ef7" stop-opacity=".1"/><stop offset="1" stop-color="#6b9ef7" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="2" y="2" width="252" height="252" rx="56" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="4"/>
  <circle cx="128" cy="128" r="86" fill="url(#arc)"/>
  <path fill="url(#jaw)" d="M31 40h36l48 88-48 88H31l48-88z"/>
  <path fill="url(#jaw)" d="M225 40h-36l-48 88 48 88h36l-48-88z"/>
  <path fill="#8bb4ff" d="M128 92q1.6 34.4 11 36q-9.4 1.6-11 36q-1.6-34.4-11-36q9.4-1.6 11-36z"/>
</svg>
